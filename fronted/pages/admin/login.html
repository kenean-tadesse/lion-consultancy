<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Lion Consultancy</title>

    <meta
        name="description"
        content="Secure Lion Consultancy administration login."
    >

    <link
        rel="stylesheet"
        href="../../css/admin.css"
    >
</head>

<body class="admin-login-page">

    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div class="admin-background">
        <div class="admin-orb admin-orb-one"></div>
        <div class="admin-orb admin-orb-two"></div>
        <div class="admin-grid"></div>
    </div>


    <!-- =========================================
         LOGIN CONTAINER
    ========================================== -->

    <main class="admin-login-container">

        <section class="admin-login-card">

            <!-- BRAND -->

            <div class="admin-brand">

                <div class="admin-brand-mark">
                    L
                </div>

                <div>
                    <h1>LION</h1>
                    <span>CONSULTANCY</span>
                </div>

            </div>


            <!-- HEADING -->

            <div class="admin-login-heading">

                <span class="admin-eyebrow">
                    SECURE ADMINISTRATION
                </span>

                <h2>
                    Welcome back.
                </h2>

                <p>
                    Sign in to manage student applications,
                    admissions and consultancy operations.
                </p>

            </div>


            <!-- ERROR -->

            <div
                id="adminLoginError"
                class="admin-message admin-message-error"
                hidden
            ></div>


            <!-- LOGIN FORM -->

            <form
                id="adminLoginForm"
                autocomplete="on"
                novalidate
            >

                <!-- EMAIL -->

                <div class="admin-form-group">

                    <label for="adminEmail">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        name="email"
                        placeholder="admin@lionconsultancy.com"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="admin-form-group">

                    <div class="admin-label-row">

                        <label for="adminPassword">
                            Password
                        </label>

                    </div>

                    <div class="admin-password-wrapper">

                        <input
                            type="password"
                            id="adminPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleAdminPassword"
                            class="admin-password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    id="adminLoginButton"
                    class="admin-login-button"
                >

                    <span
                        id="adminLoginButtonText"
                    >
                        Sign in
                    </span>

                    <span
                        id="adminLoginSpinner"
                        class="admin-spinner"
                        hidden
                    ></span>

                </button>

            </form>


            <!-- FOOTER -->

            <div class="admin-login-footer">

                <span>
                    Lion Consultancy Administration
                </span>

                <span>
                    Secure access
                </span>

            </div>

        </section>

    </main>


    <script src="../../js/admin.js"></script>

</body>
</html>
